name: Promote tag to release

# Run by hand from the Actions tab with a release candidate tag
# (vx.y.z-rcN). It must be the latest release candidate of its version, and
# the version must be newer than the latest release.
# Builds the Linux binaries at that tag and publishes release vx.y.z at the
# same commit (creating the vx.y.z tag), with the notes taken from the
# [x.y.z] section of CHANGELOG.md on main (so notes can still be fixed after
# tagging).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate tag to promote, e.g. v0.1.0-rc2
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}

concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check the tag can be promoted
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc([0-9]+)$ ]]; then
            echo "::error::Only release candidate tags (vx.y.z-rcN) can be promoted, not $TAG."
            exit 1
          fi
          version=${BASH_REMATCH[1]} rc=${BASH_REMATCH[2]}
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::There is no tag $TAG."
            exit 1
          fi
          latest=$(.github/scripts/latest-rc.sh "$version")
          if (( 10#$rc != latest )); then
            echo "::error::v$version-rc$latest is the latest release candidate of $version; only it can be promoted."
            exit 1
          fi
          sha=$(git rev-list -n 1 "refs/tags/$TAG")
          git show "refs/tags/$TAG:build.zig.zon" > tag.zon
          zon_version=$(.github/scripts/zon-version.sh tag.zon)
          if [ "$zon_version" != "$version" ]; then
            echo "::error::$TAG does not match its build.zig.zon version $zon_version."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released."
            exit 1
          fi
          latest_release=$(gh release list --limit 1000 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          if [ -n "$latest_release" ] && \
             [ "$(printf '%s\n' "$version" "${latest_release#v}" | sort -V | head -n 1)" = "$version" ]; then
            echo "::error::$version is older than the latest release $latest_release; only newer versions can be released."
            exit 1
          fi
          if existing=$(git rev-list -n 1 "refs/tags/v$version" 2>/dev/null) && [ "$existing" != "$sha" ]; then
            echo "::error::Tag v$version already exists at $existing, not at $TAG ($sha)."
            exit 1
          fi
          if ! .github/scripts/changelog-notes.sh "$version" > /dev/null 2>&1; then
            echo "::error::CHANGELOG.md on main has no [$version] section; add one and run this again."
            exit 1
          fi

          echo "::notice::Promoting $TAG ($sha) to release v$version."
          {
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          curl -L "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Verify Zig
        run: zig version

      - name: Build
        run: zig build -Doptimize=safe -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Stage executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp zig-out/bin/aroute "dist/aroute-${{ matrix.target }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: aroute-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          .github/scripts/changelog-notes.sh "$VERSION" > notes.md
          # Creates the vx.y.z tag at the promoted commit if it doesn't exist yet.
          gh release create "v$VERSION" dist/* --target "$SHA" --title "v$VERSION" --notes-file notes.md
