name: Promote tag to release

# Run by hand from the Actions tab: builds the Linux binaries at a version
# tag and publishes a GitHub release for it, with the notes taken from
# CHANGELOG.md on main (so notes can still be fixed after tagging).
#
# Promoting a release candidate (v0.1.0-rc1) publishes the final release
# v0.1.0 at the same commit, creating the v0.1.0 tag. Other suffixes
# (e.g. -beta1) are published under their own tag as pre-releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to promote, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}

concurrency:
  group: promote-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      notes_version: ${{ steps.check.outputs.notes_version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check the tag can be promoted
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::There is no tag $TAG."
            exit 1
          fi
          sha=$(git rev-list -n 1 "refs/tags/$TAG")
          git show "refs/tags/$TAG:build.zig.zon" > tag.zon
          version=$(.github/scripts/zon-version.sh tag.zon)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match its build.zig.zon version $version."
            exit 1
          fi

          # A release candidate is promoted to the final version.
          prerelease=false
          if [[ $version =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9A-Za-z.-]*$ ]]; then
            release_version=${BASH_REMATCH[1]}
          else
            release_version=$version
            [[ $version == *-* ]] && prerelease=true
          fi
          release_tag="v$release_version"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "::error::$release_tag already has a release."
            exit 1
          fi
          if existing=$(git rev-list -n 1 "refs/tags/$release_tag" 2>/dev/null) && [ "$existing" != "$sha" ]; then
            echo "::error::Tag $release_tag already exists at $existing, not at $TAG ($sha)."
            exit 1
          fi

          # Notes for the final version, else the release candidate's.
          if .github/scripts/changelog-notes.sh "$release_version" > /dev/null 2>&1; then
            notes_version=$release_version
          elif .github/scripts/changelog-notes.sh "$version" > /dev/null 2>&1; then
            notes_version=$version
          else
            sections="[$release_version]"
            [ "$version" != "$release_version" ] && sections+=" or [$version]"
            echo "::error::CHANGELOG.md on main has no $sections section; add one and run this again."
            exit 1
          fi

          echo "::notice::Promoting $TAG ($sha) to release $release_tag with the CHANGELOG [$notes_version] notes."
          {
            echo "sha=$sha"
            echo "release_tag=$release_tag"
            echo "notes_version=$notes_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          curl -L "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Verify Zig
        run: zig version

      - name: Build
        run: zig build -Doptimize=safe -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Stage executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp zig-out/bin/aroute "dist/aroute-${{ matrix.target }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: aroute-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          NOTES_VERSION: ${{ needs.check.outputs.notes_version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          .github/scripts/changelog-notes.sh "$NOTES_VERSION" > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          # Creates the release tag at the promoted commit if it doesn't exist yet.
          gh release create "$RELEASE_TAG" dist/* --target "$SHA" --title "$RELEASE_TAG" \
            --notes-file notes.md "${flags[@]}"
