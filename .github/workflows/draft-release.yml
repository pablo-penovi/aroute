name: Draft release

# When a PR is merged into main and build.zig.zon has a plain x.y.z version
# (no -rc or other suffix), make sure a draft release vx.y.z exists and points
# at the merge commit. Publishing that draft as the latest release starts the
# Release workflow.

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          version=$(.github/scripts/zon-version.sh)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Version $version is not a plain x.y.z version; no draft release."
            exit 0
          fi
          if [ "$version" = "0.0.0" ]; then
            echo "::notice::Version is still the 0.0.0 placeholder; no draft release."
            exit 0
          fi
          tag="v$version"

          # The draft shows the notes the release will get, so they can be
          # reviewed before publishing.
          if ! .github/scripts/changelog-notes.sh "$version" > notes.md; then
            echo "::warning::CHANGELOG.md has no [$version] section; add one before publishing $tag."
            printf '%s\n' "**CHANGELOG.md has no \`[$version]\` section yet.** Add one before publishing; the published release takes its notes from it." > notes.md
          fi

          # Draft releases have no tag yet, so look them up in the release list.
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" | head -n 1)

          if [ -z "$release" ]; then
            gh release create "$tag" --draft --target "$SHA" --title "$tag" --notes-file notes.md
            echo "::notice::Created draft release $tag at $SHA."
          elif [ "${release#* }" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${release%% *}" \
              -f target_commitish="$SHA" -F body=@notes.md >/dev/null
            echo "::notice::Moved draft release $tag to $SHA."
          else
            echo "::notice::$tag is already published; bump the version in build.zig.zon for a new release."
          fi
