name: Release

# Runs when a release is published, or edited later (e.g. marked as latest).
# If it is the latest release and has no binaries yet, builds them, attaches
# them, and sets the release notes to the version's CHANGELOG.md section.

on:
  release:
    types:
      - released
      - edited

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.release.tag_name }}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check it is the latest release without binaries
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release ($latest is); nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(startswith("aroute-"))] | length')
          if [ "$assets" -gt 0 ]; then
            echo "::notice::$TAG already has its binaries; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(.github/scripts/zon-version.sh)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match build.zig.zon version $version."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Zig 0.17.0
        run: |
          set -euo pipefail
          curl -L "https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Verify Zig
        run: zig version

      - name: Build
        run: zig build -Doptimize=safe -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Stage executable
        run: |
          set -euo pipefail
          mkdir -p dist
          cp zig-out/bin/aroute "dist/aroute-${{ matrix.target }}"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: aroute-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries and write notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          if .github/scripts/changelog-notes.sh "${TAG#v}" > notes.md; then
            gh release edit "$TAG" --notes-file notes.md
          else
            echo "::warning::CHANGELOG.md has no [${TAG#v}] section; release notes left as they were."
          fi
